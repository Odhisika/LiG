# DEPRECATED for deployment — deploy.sh now manages all containers with plain
# docker commands (the server's engine bundles a nonstandard compose plugin).
# This file remains only as a reference description of the production stack.
#
# Layout:
#   web-a / web-b : LiG store (gunicorn). One serves traffic (127.0.0.1:8001),
#                   the other is the standby (127.0.0.1:8002); deploy.sh flips
#                   Apache's ProxyPass between them.
#   pp-web        : PricePilot API/UI (gunicorn) on 127.0.0.1:8003
#   pp-worker     : PricePilot scrapers/sync (Celery)
#   pp-beat       : PricePilot scheduler (Celery beat)
#   db            : Postgres 16 — hosts BOTH databases (lig + pricepilot),
#                   created by deploy/postgres-init.sh on first boot
#   redis         : Celery broker + cache
#
# NOTE: services are written out EXPLICITLY (no YAML anchors/merge keys) —
# newer compose versions mishandle them.
#
# Apache keeps doing what it does today (TLS, certbot, /static/, /media/) —
# see deploy/apache/vhost-snippet.conf for the ONE-TIME vhost change.
#
# Clone this repo to /var/www/LiG so the ./staticfiles ./media ./logs bind
# mounts land exactly where your existing Apache Alias lines point.
#
# All compose commands must pass the prod env file:
#   docker compose --env-file .env.production -f docker-compose.prod.yml <cmd>

name: lig-prod

services:
  # ------------------------------------------------------------------ LiG --
  web-a:
    image: lig-app:latest
    container_name: lig-web-a
    restart: unless-stopped
    command: sh -c "exec gunicorn --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --threads 2 --timeout 120 --access-logfile - --error-logfile - LiG.wsgi:application"
    env_file:
      - .env.production
    environment:
      RUN_MIGRATE: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import http.client as c;s=c.HTTPConnection('127.0.0.1',8000,timeout=3);s.request('GET','/');r=s.getresponse();r.read()\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

  web-b:
    image: lig-app:latest
    container_name: lig-web-b
    restart: unless-stopped
    command: sh -c "exec gunicorn --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --threads 2 --timeout 120 --access-logfile - --error-logfile - LiG.wsgi:application"
    env_file:
      - .env.production
    environment:
      RUN_MIGRATE: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import http.client as c;s=c.HTTPConnection('127.0.0.1',8000,timeout=3);s.request('GET','/');r=s.getresponse();r.read()\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

  # ------------------------------------------------------------ PricePilot --
  pp-web:
    image: pp-app:latest
    container_name: lig-pp-web
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && exec gunicorn --bind 0.0.0.0:8000 --workers 2 --timeout 120 --access-logfile - config.wsgi:application"
    env_file:
      - .env.production
    environment:
      DJANGO_DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./media:/var/www/LiG/media
    ports:
      - "127.0.0.1:8003:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8000/api/ || curl -fsS -o /dev/null http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  pp-worker:
    image: pp-app:latest
    container_name: lig-pp-worker
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./media:/var/www/LiG/media
    stop_grace_period: 15m

  pp-beat:
    image: pp-app:latest
    container_name: lig-pp-beat
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./media:/var/www/LiG/media
    stop_grace_period: 30s

  # ------------------------------------------------------------- Backends --
  db:
    image: postgres:16-alpine
    container_name: lig-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-lig}
      POSTGRES_USER: ${DB_USER:-lig}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.production}
      # Consumed by deploy/postgres-init.sh on first boot (empty pgdata only)
      PRICEPILOT_DB_NAME: ${PRICEPILOT_DB_NAME:-pricepilot}
      PRICEPILOT_DB_USER: ${PRICEPILOT_DB_USER:-pricepilot}
      PRICEPILOT_DB_PASSWORD: ${PRICEPILOT_DB_PASSWORD:?set PRICEPILOT_DB_PASSWORD in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-pricepilot.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lig} -d ${DB_NAME:-lig}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lig-prod-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
