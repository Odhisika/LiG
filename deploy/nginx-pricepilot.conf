# Optional: serve the PricePilot web UI / API on its own subdomain.
#
# Skip this file if you only need the background monitor + store sync
# (pricepilot-worker.service and pricepilot-beat.service) — those run
# without any web server.
#
# Requirements:
#   - a DNS A record for pricepilot.example.com pointing at this server
#   - an HTTPS certificate (after copying, run certbot for the subdomain)
#   - the frontend built once (see docs/PRICEPILOT_DEPLOYMENT.md)
#
# Install:
#   sudo cp deploy/nginx-pricepilot.conf /etc/nginx/sites-available/pricepilot
#   sudo ln -s /etc/nginx/sites-available/pricepilot /etc/nginx/sites-enabled/pricepilot
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pricepilot.example.com

server {
    listen 80;
    server_name pricepilot.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pricepilot.example.com;

    ssl_certificate     /etc/letsencrypt/live/pricepilot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pricepilot.example.com/privkey.pem;

    client_max_body_size 25M;

    location /static/ {
        alias /srv/lig/app/pricepilot/staticfiles/;
    }

    location /media/ {
        alias /srv/lig/app/media/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built React frontend (optional).
    location / {
        root /srv/lig/app/pricepilot/frontend/dist;
        try_files $uri /index.html;
    }
}
