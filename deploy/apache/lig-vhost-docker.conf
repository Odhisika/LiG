# lig.com.gh — Docker-stack cutover vhost (replaces the mod_wsgi block).
# Rollback: restore the previous a-le-ssl.conf and reload apache2.
<IfModule mod_ssl.c>
<VirtualHost 10.20.0.2:443>
    ServerName lig.com.gh
    DocumentRoot /var/www/LiG

    # Static files
    Alias /static /var/www/LiG/staticfiles
    <Directory /var/www/LiG/staticfiles>
        Require all granted
    </Directory>

    # Media files
    Alias /media /var/www/LiG/media
    <Directory /var/www/LiG/media>
        Require all granted
    </Directory>

    # Docker stack (lig-web-a) — same flip target as deploy.sh blue/green
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # Serve local files directly; must precede the catch-all ProxyPass
    ProxyPass /media !
    ProxyPass /static !
    ProxyPass / http://127.0.0.1:8001/ retry=0 connectiontimeout=5 timeout=120
    ProxyPassReverse / http://127.0.0.1:8001/

    # Brotli Compression
    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css text/javascript application/javascript application/json application/xml+rss
    </IfModule>

    # SSL
    SSLCertificateFile /etc/letsencrypt/live/lig.com.gh/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/lig.com.gh/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
