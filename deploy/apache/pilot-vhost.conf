# pilot.lig.com.gh — PricePilot UI + API (final: HTTP redirect + SSL)
<VirtualHost *:80>
    ServerName pilot.lig.com.gh
    RewriteEngine On
    RewriteRule ^ https://pilot.lig.com.gh%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName pilot.lig.com.gh

    # React SPA (built assets)
    DocumentRoot /var/www/LiG/pricepilot/frontend/dist
    <Directory /var/www/LiG/pricepilot/frontend/dist>
        Require all granted
        FallbackResource /index.html
    </Directory>

    # Django API + admin + its static files -> pp-web container
    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8003/api/
    ProxyPassReverse /api/ http://127.0.0.1:8003/api/
    ProxyPass /static/ http://127.0.0.1:8003/static/
    ProxyPassReverse /static/ http://127.0.0.1:8003/static/
    ProxyPass /admin/ http://127.0.0.1:8003/admin/
    ProxyPassReverse /admin/ http://127.0.0.1:8003/admin/
    RequestHeader set X-Forwarded-Proto "https"

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/pilot.lig.com.gh/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pilot.lig.com.gh/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
