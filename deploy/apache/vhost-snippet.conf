# ONE-TIME Apache change — after this, deploys are just ./deploy.sh
#
# In your existing lig.com.gh :443 VirtualHost (/etc/apache2/sites-available/...):
#   1. DELETE the old mod_wsgi lines (WSGIScriptAlias, WSGIDaemonProcess,
#      WSGIProcessGroup, PythonPath / PythonHome, etc.)
#   2. KEEP your existing  Alias /static/ ...  and  Alias /media/ ...  lines
#   3. ADD inside that VirtualHost:
#
#        IncludeOptional /var/www/LiG/deploy/apache/active.conf
#
#   4. Enable modules and reload:
#        sudo a2enmod proxy proxy_http headers
#        sudo apachectl configtest && sudo systemctl reload apache2
#
# active.conf is rewritten by deploy.sh on every release (port 8001 <-> 8002)
# and `systemctl reload apache2` is GRACEFUL: open connections never drop.
#
# Sudo access needed by the deploy user:
#   lig ALL=(root) NOPASSWD: /usr/sbin/apachectl, \
#       /bin/systemctl reload apache2, /usr/bin/tee /var/www/LiG/deploy/apache/active.conf

# ---- content of active.conf (managed by deploy.sh) -------------------------
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"
ProxyPass / http://127.0.0.1:8001/ retry=0 connectiontimeout=5 timeout=120
ProxyPassReverse / http://127.0.0.1:8001/
