{% if delta is None %}
    <span class="g-trend-pill g-trend-neutral">
        <i class="fas fa-minus me-1 opacity-50"></i>no prior data
    </span>
{% elif delta > 0 %}
    <span class="g-trend-pill g-trend-up">
        <i class="fas fa-arrow-up me-1"></i>+{{ delta|floatformat:1 }}%
    </span>
{% elif delta < 0 %}
    <span class="g-trend-pill g-trend-down">
        <i class="fas fa-arrow-down me-1"></i>{{ delta|floatformat:1 }}%
    </span>
{% else %}
    <span class="g-trend-pill g-trend-neutral">
        <i class="fas fa-equals me-1 opacity-50"></i>0.0%
    </span>
{% endif %}
